name: Daily Real Estate News Automation

on:
  schedule:
    # 매일 UTC 22:00 = 한국시간(KST) 오전 07:00 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # 관리자가 필요할 때 수동으로 즉시 실행 가능

permissions:
  contents: write # 갱신된 index.html을 저장소에 푸시할 권한 부여

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 패키지 설치
        run: |
          pip install requests google-generativeai

      - name: 뉴스 수집 및 HTML 생성 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_news.py

      - name: 변경된 HTML 저장소에 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto Update: $(date +'%Y-%m-%d %H:%M') KST 뉴스 갱신" || exit 0
          git push
